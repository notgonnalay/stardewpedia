<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- Starfruit five-point shape -->
  <!-- Center -->
  <rect x="6" y="6" width="4" height="4" fill="#FFE042"/>
  <!-- Top point -->
  <rect x="7" y="2" width="2" height="4" fill="#FFE042"/>
  <rect x="7" y="1" width="2" height="1" fill="#4B8E3D"/>
  <!-- Bottom points -->
  <rect x="5" y="10" width="2" height="3" fill="#F0C61D"/>
  <rect x="9" y="10" width="2" height="3" fill="#D4A708"/>
  <rect x="4" y="13" width="2" height="2" fill="#D4A708"/>
  <rect x="10" y="13" width="2" height="2" fill="#B38B00"/>
  <!-- Left point -->
  <rect x="2" y="5" width="4" height="3" fill="#FFF275"/>
  <rect x="1" y="6" width="2" height="2" fill="#FFE042"/>
  <!-- Right point -->
  <rect x="10" y="5" width="4" height="3" fill="#F0C61D"/>
  <rect x="13" y="6" width="2" height="2" fill="#D4A708"/>
  <!-- Star highlights -->
  <rect x="7" y="6" width="2" height="2" fill="#FFFFFF"/>
</svg>
