<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- Spiny dorsal fin -->
  <rect x="5" y="4" width="1" height="2" fill="#756534"/>
  <rect x="7" y="3" width="1" height="3" fill="#8C793E"/>
  <rect x="9" y="4" width="1" height="2" fill="#756534"/>
  <!-- Body -->
  <rect x="2" y="7" width="3" height="3" fill="#8C793E"/>
  <rect x="5" y="6" width="6" height="5" fill="#A48F4D"/>
  <rect x="6" y="7" width="5" height="2" fill="#C2AB5E"/>
  <rect x="5" y="10" width="6" height="1" fill="#E8D999"/>
  <!-- Glowing glassy eye (characteristic of Walleye) -->
  <rect x="3" y="7" width="1" height="1" fill="#FFFFFF"/>
  <!-- Tail fin -->
  <rect x="11" y="8" width="2" height="2" fill="#756534"/>
  <rect x="13" y="6" width="2" height="6" fill="#8C793E"/>
  <rect x="14" y="7" width="1" height="4" fill="#605228"/>
</svg>
