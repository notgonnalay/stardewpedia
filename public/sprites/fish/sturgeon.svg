  <rect x="2" y="7" width="2" height="3" fill="#6B7D76"/>
  <!-- Armoured scutes (ridges) -->
  <rect x="5" y="5" width="2" height="1" fill="#A8BFB5"/>
  <rect x="8" y="5" width="2" height="1" fill="#A8BFB5"/>
  <rect x="11" y="6" width="2" height="1" fill="#A8BFB5"/>
